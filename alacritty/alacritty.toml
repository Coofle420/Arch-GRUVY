[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "None"
opacity = 1.0
blur = false

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 12.0

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

# Gruvbox dark (hard)
[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.cursor]
text = "#1d2021"
cursor = "#fe8019"

[colors.selection]
text = "CellForeground"
background = "#504945"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
