# ── kitty · gruvbox dark (hard) ─────────────────────────────────

# Font
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor
modify_font      cell_height 110%

# Window
window_padding_width   12 14
placement_strategy     center
hide_window_decorations yes
confirm_os_window_close 0
background_opacity     0.95
dynamic_background_opacity yes
remember_window_size   no
initial_window_width   110c
initial_window_height  32c

# Splits inside kitty
enabled_layouts splits,stack
window_border_width 1.5pt
window_margin_width 2
inactive_text_alpha 0.75
active_border_color   #fe8019
inactive_border_color #3c3836
bell_border_color     #fabd2f

# Cursor
cursor_shape          beam
cursor_beam_thickness 2
cursor_blink_interval 0.6
cursor_stop_blinking_after 10
cursor_trail          3
cursor_trail_decay    0.08 0.3
cursor_trail_start_threshold 2

# Scrollback / mouse
scrollback_lines      20000
scrollbar scrolled
copy_on_select        yes
strip_trailing_spaces smart
url_style             curly
detect_urls           yes
mouse_hide_wait       2.0

# Performance — sync to the 200 Hz display
repaint_delay  4
input_delay    1
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #3c3836

# Tab bar
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_bar_margin_height 4 4
tab_title_template    " {index}  {title[:30]} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Colors ──────────────────────────────────────────────────────
foreground            #ebdbb2
background            #1d2021
selection_foreground  #ebdbb2
selection_background  #504945
cursor                #fe8019
cursor_text_color     #1d2021
url_color             #83a598

active_tab_foreground   #1d2021
active_tab_background   #fe8019
inactive_tab_foreground #a89984
inactive_tab_background #32302f
tab_bar_background      #1d2021

mark1_foreground #1d2021
mark1_background #fabd2f
mark2_foreground #1d2021
mark2_background #8ec07c
mark3_foreground #1d2021
mark3_background #d3869b

# black
color0  #282828
color8  #928374
# red
color1  #cc241d
color9  #fb4934
# green
color2  #98971a
color10 #b8bb26
# yellow
color3  #d79921
color11 #fabd2f
# blue
color4  #458588
color12 #83a598
# magenta
color5  #b16286
color13 #d3869b
# cyan
color6  #689d6a
color14 #8ec07c
# white
color7  #a89984
color15 #ebdbb2

# ── Keys ────────────────────────────────────────────────────────
# Shift+Enter newline (same as the Alacritty config, for Claude Code etc.)
map shift+enter send_text all \x1b\r

map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+z     toggle_layout stack
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+0     change_font_size all 0
map ctrl+shift+a>k   set_background_opacity +0.05
map ctrl+shift+a>j   set_background_opacity -0.05
map ctrl+shift+a>r   set_background_opacity default
map ctrl+shift+f5    load_config_file
